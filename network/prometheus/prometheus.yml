global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "streamlit"
    static_configs: [{ targets: ["streamlit:9100"] }]

  - job_name: "api"
    static_configs: [{ targets: ["api:8000"] }]

  - job_name: "dl"
    static_configs: [{ targets: ["dl:9000"] }]

  - job_name: "cadvisor"
    static_configs: [{ targets: ["cadvisor:8080"] }]

  - job_name: "node"
    static_configs: [{ targets: ["node-exporter:9100"] }]

  - job_name: "dcgm"        # métricas GPU NVIDIA
    static_configs: [{ targets: ["dcgm-exporter:9400"] }]