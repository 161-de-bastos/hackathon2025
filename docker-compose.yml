version: "3.9"

networks:
  public:
  internal:
    internal: true

volumes:
  prometheus-data:
  grafana-data:

services:
  traefik:
    image: traefik:v3.1
    command:
      - "--providers.docker=true"
      - "--providers.file.directory=/etc/traefik"
      - "--entrypoints.web.address=:80"
      - "--ping=true"
      - "--ping.entrypoint=web"

      - "--api.dashboard=true"
    ports:
      - "127.0.0.1:80:80"   
    volumes:
      - ./network/reverse-proxy/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [public, internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/ping"]
      interval: 20s
      timeout: 5s
      retries: 5

  streamlit:
    build:
      context: ./network/streamlit
    environment:
      - API_URL=http://api:8000
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    networks: [public, internal]
    depends_on:
      api:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.front-auth.basicauth.usersfile=/auth.htpasswd"
      - "traefik.http.middlewares.front-rl.ratelimit.average=10"
      - "traefik.http.middlewares.front-rl.ratelimit.burst=20"
      - "traefik.http.routers.front.middlewares=front-auth,front-rl"
      - "traefik.http.routers.front.rule=PathPrefix(`/`)"
      - "traefik.http.routers.front.entrypoints=web"
      - "traefik.http.services.front.loadbalancer.server.port=8501"
    volumes:
      - ./network/reverse-proxy/auth.htpasswd:/auth.htpasswd:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build: ./network/api
    networks: [internal]
    depends_on:
      dl:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5

  dl:
    build:
      context: ./network/dl
      args:
        GIT_REF: main
        REPO_URL: https://github.com/161-de-bastos/hackathon2025.git
    environment:
      - MANN_ENTRYPOINT=hackathon2025.api.mann_infer:infer
      - REPO_DIR=/app/hackathon2025
    networks: [internal]
    gpus: all
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5

  # ---- MONITOREO ----
  prometheus:
    image: prom/prometheus:v2.55.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention=15d"]
    volumes:
      - ./network/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 20s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    networks: [public, internal]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.graf.rule=PathPrefix(`/grafana`)"
      - "traefik.http.routers.graf.entrypoints=web"
      - "traefik.http.middlewares.graf-strip.stripprefix.prefixes=/grafana"
      - "traefik.http.routers.graf.middlewares=graf-strip"
      - "traefik.http.services.graf.loadbalancer.server.port=3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 10

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    networks: [internal]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/metrics"]
      interval: 30s
      timeout: 5s
      retries: 5

  node-exporter:
    image: prom/node-exporter:v1.8.2
    networks: [internal]
    pid: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 5

  dcgm-exporter:
    image: nvidia/dcgm-exporter:3.3.7-3.5.0-ubuntu22.04
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9400/metrics"]
      interval: 30s
      timeout: 5s
      retries: 5